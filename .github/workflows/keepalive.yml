# Keeps the Supabase project awake, and tells me when the site is not.
#
# Supabase pauses a free project after a week of too little database activity.
# A portfolio project is idle for weeks by nature, so without this the link on
# a resume quietly stops working, and the first person to notice is whoever
# opened it.
#
# Twice a week is comfortably inside the one-week window and leaves room for a
# missed run. GitHub delays scheduled jobs under load, so the minute is
# deliberately off the hour.
#
# One caveat worth knowing rather than discovering: GitHub disables scheduled
# workflows in a repository with no commits for 60 days, and sends an email
# first. If that happens, re-enable it from the Actions tab.
name: keepalive

on:
  schedule:
    - cron: '17 7 * * 1,4' # Mondays and Thursdays, 07:17 UTC
  workflow_dispatch: # so it can be run by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the health endpoint
        run: |
          echo "GET https://privacyph.vercel.app/api/health"

          # --fail-with-body so a 503 both fails the step and prints why.
          body=$(curl --silent --show-error --fail-with-body \
                      --max-time 30 --retry 2 --retry-delay 10 \
                      https://privacyph.vercel.app/api/health) || status=$?

          echo "$body"

          if [ -n "${status:-}" ]; then
            echo "::error::health check failed — the database may be paused or the site down"
            exit 1
          fi

          # A 200 carrying ok:false would otherwise pass silently.
          case "$body" in
            *'"ok":true'*) echo "awake" ;;
            *) echo "::error::unexpected body"; exit 1 ;;
          esac
